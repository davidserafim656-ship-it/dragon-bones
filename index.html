<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#050a0d" />
  <title>Dragon Bones Online</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="brand">DRAGON BONES</div>
    <div class="stats">
      <span>🦴 <b id="score">0</b></span>
      <span>👥 <b id="players">1</b></span>
      <span id="status">Offline</span>
    </div>
  </div>

  <div class="tip" id="tip">Mova o mouse ou toque na tela para guiar o dragão</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./game.js"></script>
</body>
</html>
